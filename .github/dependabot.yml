version: 2

# Minor and patch updates arrive as one weekly PR per ecosystem.
# Major updates get their own PR each, so a breaking one can't block the rest.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # only touch composer.json when the new version is outside the constraint
    versioning-strategy: increase-if-necessary
    groups:
      composer:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
